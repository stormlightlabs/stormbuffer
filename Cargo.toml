[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/mcp",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "string", "wrap_help"] }
clap_complete = "4.5"
anyhow = "1.0"
clap_mangen = "0.2"
fs2 = "0.4"
owo-colors = "4.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "=0.3.53", features = ["formatting", "parsing"] }
toml = "=0.8.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.24", features = ["v7"] }
fastembed = { version = "=5.13.4", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
sqlite-vec = "=0.1.7"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
