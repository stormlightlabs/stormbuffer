[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/mcp",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "string", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"
owo-colors = "4.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
